name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 index.html 404.html

      - name: Check internal links and assets
        run: python3 tools/check-links.py

      - name: No raw email address in published files
        run: |
          if grep -rIl --include='*.html' --include='*.js' --include='*.xml' --include='*.txt' -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' index.html 404.html assets robots.txt sitemap.xml; then
            echo "A raw email address was found in a published file." >&2
            exit 1
          fi
