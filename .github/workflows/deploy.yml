name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write to Pages, mint an OIDC token for the
# Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Publish an explicit allow-list only. DESIGN.md, README, DEPLOY.md,
      # tools/ and .github/ are never part of the site.
      - name: Assemble _site
        run: |
          set -eu
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml .nojekyll _site/
          cp favicon.svg favicon-32.png apple-touch-icon.png og-image.png _site/
          cp -R assets _site/assets
          echo "Published files:"; find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
